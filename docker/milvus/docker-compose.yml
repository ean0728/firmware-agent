services:
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v3.0.0-beta.6
    restart: always
    environment:
      MILVUS_ADDRESS: standalone:19530
      MILVUS_NAME: local-milvus
    ports:
      - "3000:3000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/attu:/data
networks:
  default:
    external: true
    name: milvus
